<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date and Time — Thagobyte</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="date-and-time.css">
<link rel="icon" href="images/thagobyte_logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#faa968">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">Home</a>
    <nav>
      <a href="news.html">News</a>
      <a href="games.html">Games</a>
      <a href="cinema.html">Cinema</a>
      <a href="tools.html">Tools</a>
    </nav>
  </div>
</header>

<main>
  <section class="calendar-intro">
    <div class="wrap">
      <h1>Date and Time</h1>
    </div>
  </section>

  <section class="calendar-panel">
    <div class="wrap calendar-layout">

      <div class="calendar-card">
        <div class="calendar-toolbar">
          <button type="button" class="calendar-nav" id="calendar-prev" aria-label="Previous month">&larr;</button>
          <div class="calendar-title">
            <span id="calendar-month-year">January 2026</span>
          </div>
          <button type="button" class="calendar-nav" id="calendar-next" aria-label="Next month">&rarr;</button>
        </div>
        <button type="button" class="calendar-today-btn" id="calendar-today">Today</button>

        <div class="calendar-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

    </div>
  </section>

  <section class="timeconvert-section">
    <div class="wrap">
      <h2 class="timeconvert-heading">Time Conversion</h2>
      <div class="timeconvert-card">
        <div class="timeconvert-row">
          <label class="timeconvert-field" for="tc-datetime">
            Date &amp; time
            <input type="datetime-local" id="tc-datetime">
          </label>
          <button type="button" class="timeconvert-now" id="tc-now">Now</button>
        </div>

        <div class="timeconvert-row timeconvert-zones">
          <label class="timeconvert-field" for="tc-from">
            From
            <select id="tc-from"></select>
          </label>
          <button type="button" class="timeconvert-swap" id="tc-swap" aria-label="Swap timezones">&#8644;</button>
          <label class="timeconvert-field" for="tc-to">
            To
            <select id="tc-to"></select>
          </label>
        </div>

        <div class="timeconvert-result" id="tc-result" aria-live="polite"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 Thagobyte</span>
  </div>
</footer>

<script src="date-and-time.js"></script>
<script src="pwa.js"></script>
<script src="somafm-player.js"></script>
</body>
</html>
