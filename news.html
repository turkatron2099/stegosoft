<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — Stegosoft</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="news.css">
<link rel="icon" href="images/stegosoft-logo.jpg">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html"><img src="images/stegosoft-logo.jpg" alt="Stegosoft" class="logo-img"></a>
    <nav>
      <a href="news.html">News</a>
      <a href="games.html">Games</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="news-intro">
    <div class="wrap">
      <h1>News</h1>
      <p class="tagline">One digest a day, from what I actually care about.</p>
      <p class="digest-updated" id="digest-updated"></p>
    </div>
  </section>

  <section class="news-feeds">
    <div class="wrap">
      <div id="digest-summary"></div>
      <ul class="digest-list" id="digest-list" data-status="loading">
        <li class="digest-status">Loading today's digest…</li>
      </ul>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 Stegosoft</span>
  </div>
</footer>

<script src="news.js"></script>
</body>
</html>
