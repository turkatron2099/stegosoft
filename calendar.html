<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Thagobyte</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="calendar.css">
<link rel="icon" href="images/thagobyte_logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#faa968">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">Home</a>
    <nav>
      <a href="news.html">News</a>
      <a href="games.html">Games</a>
      <a href="cinema.html">Cinema</a>
      <a href="tools.html">Tools</a>
    </nav>
  </div>
</header>

<main>
  <section class="calendar-intro">
    <div class="wrap">
      <h1>Calendar</h1>
    </div>
  </section>

  <section class="calendar-panel">
    <div class="wrap calendar-layout">

      <div class="calendar-card">
        <div class="calendar-toolbar">
          <button type="button" class="calendar-nav" id="calendar-prev" aria-label="Previous month">&larr;</button>
          <div class="calendar-title">
            <span id="calendar-month-year">January 2026</span>
          </div>
          <button type="button" class="calendar-nav" id="calendar-next" aria-label="Next month">&rarr;</button>
        </div>
        <button type="button" class="calendar-today-btn" id="calendar-today">Today</button>

        <div class="calendar-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <div class="calendar-agenda">
        <h2 id="calendar-agenda-title">Select a day</h2>
        <ul class="calendar-event-list" id="calendar-event-list"></ul>
        <form class="calendar-add-form" id="calendar-add-form">
          <input type="text" id="calendar-add-input" placeholder="Add an event&hellip;" autocomplete="off" maxlength="120">
          <button type="submit">Add</button>
        </form>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 Thagobyte</span>
  </div>
</footer>

<script src="calendar.js"></script>
<script src="pwa.js"></script>
<script src="somafm-player.js"></script>
</body>
</html>
