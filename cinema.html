<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema — Thagobyte</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cinema.css">
<link rel="icon" href="images/thagobyte_logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#faa968">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">Home</a>
    <nav>
      <a href="news.html">News</a>
      <a href="games.html">Games</a>
      <a href="cinema.html">Cinema</a>
      <a href="tools.html">Tools</a>
    </nav>
  </div>
</header>

<main>
  <section class="cinema-intro">
    <div class="wrap">
      <h1>Cinema</h1>
    </div>
  </section>

  <section class="cinema-panel">
    <div class="wrap">

      <div class="cinema-screen">
        <video id="cinema-player" controls autoplay muted playsinline>
          Your browser doesn't support embedded video.
        </video>
      </div>

      <div class="cinema-info">
        <h2 id="cinema-title"></h2>
        <p class="cinema-blurb" id="cinema-blurb"></p>
        <p class="cinema-credit">
          Public domain. Print via <a id="cinema-source-link" target="_blank" rel="noopener">Internet Archive</a>.
          Autoplays muted — use the player's volume control for sound.
          <span id="cinema-cc-note" hidden>Closed captions available — turn them on with the player's CC button.</span>
        </p>
      </div>

      <div class="cinema-playlist" id="cinema-playlist"></div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 Thagobyte</span>
  </div>
</footer>

<script src="cinema.js"></script>
<script src="pwa.js"></script>
<script src="somafm-player.js"></script>
</body>
</html>
