<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games — Stegosoft</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="games.css">
<link rel="icon" href="images/stegosoft-logo.jpg">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">Home</a>
    <nav>
      <a href="news.html">News</a>
      <a href="games.html">Games</a>
      <a href="tools.html">Tools</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="games-intro">
    <div class="wrap">
      <h1>Games</h1>
      <p class="tagline">Drag a cartridge into the console to play.</p>
    </div>
  </section>

  <section class="game-room">
    <div class="wrap game-room-layout">

      <div class="console" id="console">
        <div class="console-top">
          <span class="console-brand">STEGO <em>ENTERTAINMENT SYSTEM</em></span>
          <span class="console-led" id="console-led" title="Power"></span>
        </div>

        <div class="console-vents"></div>

        <div class="console-slot" id="console-slot">
          <div class="slot-opening"></div>
          <span class="slot-label">insert cartridge</span>
        </div>

        <div class="console-screen">
          <div class="screen-placeholder" id="screen-placeholder">
            <div class="placeholder-off" id="placeholder-off">
              <canvas id="static-canvas"></canvas>
              <div class="static-scanlines"></div>
              <div class="placeholder-off-text">
                <p>NO SIGNAL</p>
              </div>
            </div>
            <div class="placeholder-boot" id="placeholder-boot" hidden>
              <canvas id="boot-logo-canvas" width="160" height="160"></canvas>
              <p>Insert a Cartridge</p>
            </div>
          </div>
          <canvas id="game-canvas" width="720" height="480" tabindex="0" hidden></canvas>
          <div class="hud" id="hud" hidden>
            <span id="hud-title"></span>
          </div>
        </div>

        <div class="console-controls">
          <div class="console-buttons">
            <button type="button" class="console-btn" id="reset-btn">RESET</button>
            <button type="button" class="console-btn" id="fullscreen-btn">FULLSCREEN</button>
            <button type="button" class="console-btn console-btn-power" id="power-btn">POWER</button>
          </div>
          <p id="controls-hint">Arrow keys / WASD to move &middot; Space to fire &middot; Enter to restart</p>
        </div>
      </div>

      <div class="cartridge-shelf" id="cartridge-shelf" aria-label="Game cartridges">
        <div class="cartridge" draggable="true" data-game="asteroids" tabindex="0" role="button" aria-label="Insert Asteroids cartridge">
          <div class="cartridge-label cartridge-asteroids">
            <span class="cartridge-title">ASTEROIDS</span>
            <span class="cartridge-sub">vector combat</span>
          </div>
        </div>
        <div class="cartridge" draggable="true" data-game="coolCars" tabindex="0" role="button" aria-label="Insert Cool Cars cartridge">
          <div class="cartridge-label cartridge-coolcars">
            <span class="cartridge-title">COOL CARS</span>
            <span class="cartridge-sub">count to ten</span>
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 Stegosoft</span>
  </div>
</footer>

<script src="games/asteroids.js"></script>
<script src="games/cool-cars.js"></script>
<script src="games.js"></script>
</body>
</html>
