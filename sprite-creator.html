<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprite Creator — Thagobyte</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sprite-creator.css">
<link rel="icon" href="images/thagobyte_logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#faa968">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">Home</a>
    <nav>
      <a href="news.html">News</a>
      <a href="games.html">Games</a>
      <a href="cinema.html">Cinema</a>
      <a href="tools.html">Tools</a>
    </nav>
  </div>
</header>

<main>
  <section class="sprite-intro">
    <div class="wrap">
      <h1>Sprite Creator</h1>
    </div>
  </section>

  <section class="sprite-panel">
    <div class="wrap">

      <div class="sprite-controls">
        <label class="sprite-field">
          Name
          <input type="text" id="name-input" value="my_sprite" autocomplete="off" spellcheck="false">
        </label>
        <label class="sprite-field">
          Width
          <span class="sprite-field-row">
            <input type="number" id="width-input" min="1" max="64" value="16">
            <span class="sprite-field-unit">px</span>
          </span>
        </label>
        <label class="sprite-field">
          Height
          <span class="sprite-field-row">
            <input type="number" id="height-input" min="1" max="64" value="16">
            <span class="sprite-field-unit">px</span>
          </span>
        </label>
      </div>

      <div class="sprite-workspace">
        <div class="sprite-canvas-col">
          <div class="sprite-canvas-wrap">
            <canvas id="grid-canvas"></canvas>
          </div>
          <div class="sprite-actions">
            <button type="button" id="erase-toggle" class="sprite-toggle" aria-pressed="false">Eraser</button>
            <button type="button" id="clear-btn">Clear</button>
            <button type="button" id="invert-btn">Invert</button>
          </div>
        </div>

        <div class="sprite-side-col">
          <div class="sprite-preview-block">
            <span class="sprite-side-label">Preview color (display only)</span>
            <div class="palette-grid" id="palette-grid"></div>
          </div>

          <div class="sprite-preview-block">
            <span class="sprite-side-label">Actual size</span>
            <div class="sprite-truesize-wrap">
              <canvas id="truesize-canvas"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="sprite-output">
        <span class="sprite-side-label">.sprite line — paste directly into a .asm file</span>
        <textarea id="output-line" readonly rows="3" spellcheck="false"></textarea>
        <div class="sprite-output-actions">
          <button type="button" id="copy-btn">Copy</button>
          <button type="button" id="download-btn">Download .txt</button>
          <a id="download-link" hidden></a>
        </div>
        <p class="sprite-output-status" id="copy-status" hidden></p>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 Thagobyte</span>
  </div>
</footer>

<script src="sprite-creator.js"></script>
<script src="pwa.js"></script>
<script src="somafm-player.js"></script>
</body>
</html>
