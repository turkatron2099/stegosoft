<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible — Thagobyte</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="bible.css">
<link rel="icon" href="images/thagobyte_logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#faa968">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">Home</a>
    <nav>
      <a href="news.html">News</a>
      <a href="games.html">Games</a>
      <a href="cinema.html">Cinema</a>
      <a href="tools.html">Tools</a>
    </nav>
  </div>
</header>

<main>
  <section class="bible-intro">
    <div class="wrap">
      <h1>Bible</h1>
      <p class="tagline">Look up a verse, passage, or chapter right here, without leaving Thagobyte.</p>
    </div>
  </section>

  <section class="bible-panel">
    <div class="wrap">

      <div class="bible-form">
        <input type="text" id="ref-input" placeholder="e.g. John 3:16, Psalm 23, Genesis 1:1-5" autocomplete="off">
        <select id="translation-select">
          <option value="web">World English Bible</option>
          <option value="kjv">King James Version</option>
          <option value="asv">American Standard Version</option>
          <option value="bbe">Bible in Basic English</option>
          <option value="darby">Darby Bible</option>
          <option value="oeb-us">Open English Bible (US)</option>
          <option value="ylt">Young's Literal Translation (NT only)</option>
        </select>
        <button type="button" id="search-btn">Look Up</button>
      </div>

      <p class="bible-status" id="status-text" hidden></p>

      <div class="bible-result" id="result-box" hidden>
        <div class="passage-header">
          <h2 class="passage-reference" id="passage-reference"></h2>
          <span class="passage-translation" id="passage-translation"></span>
        </div>
        <div class="passage-text" id="passage-text"></div>
      </div>

      <p class="bible-note">
        Text from <a href="https://bible-api.com" target="_blank" rel="noopener">bible-api.com</a> —
        every translation offered here is public domain.
      </p>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 Thagobyte</span>
  </div>
</footer>

<script src="bible.js"></script>
<script src="pwa.js"></script>
<script src="somafm-player.js"></script>
</body>
</html>
